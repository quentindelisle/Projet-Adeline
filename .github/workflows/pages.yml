# Publication automatique du site sur GitHub Pages
# À chaque modification de la branche main (depuis l'espace gestion ou à la main),
# les données sont vérifiées puis le dossier « site » est mis en ligne.
name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Vérifier les données
        run: node scripts/verifier.js
      - name: Préparer la version hors ligne
        run: node scripts/hors-ligne.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploiement
        uses: actions/deploy-pages@v4
